name: Robonix package check

on:
  push:
  pull_request:

jobs:
  python-checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Python dependencies
        run: python -m pip install -e ".[dev]"
      - name: Static package check
        run: python scripts/check_package.py .
      - name: Unit tests
        run: pytest -q
      - name: Compile Python package
        run: python -m compileall -q robonix_openvla_skill
