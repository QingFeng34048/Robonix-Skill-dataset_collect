[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robonix-dataset-collect-skill"
version = "0.1.0"
description = "Robonix skill for collecting robot demonstrations into HDF5."
requires-python = ">=3.10"
license = { text = "MulanPSL-2.0" }
authors = [
  { name = "Lingyue Zhang" },
]
dependencies = [
  "numpy>=1.24",
  "h5py>=3.9",
  "opencv-python-headless>=4.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[tool.setuptools.packages.find]
include = ["dataset_collect_skill*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
