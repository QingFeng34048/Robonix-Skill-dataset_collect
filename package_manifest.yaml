manifestVersion: 1

package:
  name: robonix.skill.deployment_data_collection
  version: 0.1.0
  description: Collect task-conditioned robot demonstrations into HDF5 episodes.
  license: MulanPSL-2.0
  tags:
    - skill
    - dataset
    - collection
    - hdf5
    - manipulation
    - sim2real
  maintainers:
    - Lingyue Zhang <zly3404842897@gmail.com>

build: bash scripts/build.sh
start: bash scripts/start.sh

capabilities:
  - name: robonix/skill/dataset_collect/episode/start
    path: capabilities/episode_start.v1.toml

  - name: robonix/skill/dataset_collect/episode/finish
    path: capabilities/episode_finish.v1.toml

  - name: robonix/skill/dataset_collect/status
    path: capabilities/status.v1.toml

  - name: robonix/skill/dataset_collect/cancel
    path: capabilities/cancel.v1.toml
